name: pages build and deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy-secondary.outputs.page_url || steps.deploy-primary.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy-primary
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Retry Pages deploy after transient failure
        id: deploy-secondary
        if: steps.deploy-primary.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Fail when both deploy attempts fail
        if: steps.deploy-primary.outcome == 'failure' && steps.deploy-secondary.outcome == 'failure'
        run: exit 1
