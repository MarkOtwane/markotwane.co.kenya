<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main id="login-view" class="login">
    <div class="login-card">
      <div class="login-brand"><span class="logo" aria-hidden="true">MO</span><span>Portfolio Admin</span></div>
      <h1>Welcome back</h1>
      <p class="hint">Sign in to manage your website content.</p>
      <form id="login-form" novalidate>
        <label>Email
          <span class="input-icon"><i class="fas fa-envelope" aria-hidden="true"></i><input type="email" name="email" required autocomplete="username" placeholder="you@example.com"></span>
        </label>
        <label>Password
          <span class="input-icon"><i class="fas fa-lock" aria-hidden="true"></i><input type="password" name="password" required minlength="8" autocomplete="current-password" placeholder="Your password">
            <button type="button" class="toggle-password" aria-label="Show password"><i class="fas fa-eye"></i></button></span>
        </label>
        <p class="message login-error" role="alert"></p>
        <button class="login-submit"><span>Sign in</span><i class="fas fa-arrow-right" aria-hidden="true"></i></button>
      </form>
    </div>
    <a href="../" class="back-link"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to website</a>
  </main>

  <div id="dashboard-view" class="layout" hidden>
    <aside class="sidebar">
      <div class="brand">Portfolio Admin</div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <a href="../" target="_blank" rel="noopener" class="link-btn"><i class="fas fa-external-link-alt"></i> View site</a>
        <button id="logout" class="secondary"><i class="fas fa-sign-out-alt"></i> Log out</button>
      </div>
    </aside>
    <main class="content">
      <header class="page-header">
        <h1 id="page-title"></h1>
        <p id="page-hint" class="hint"></p>
      </header>
      <div id="page"></div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
