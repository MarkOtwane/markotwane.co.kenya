<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main id="login-view" class="card">
    <h1>Portfolio Admin</h1>
    <p>Sign in to manage your website.</p>
    <form id="login-form">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required minlength="8" autocomplete="current-password"></label>
      <button>Sign in</button>
      <p class="message" role="status"></p>
    </form>
  </main>

  <div id="dashboard-view" class="layout" hidden>
    <aside class="sidebar">
      <div class="brand">Portfolio Admin</div>
      <nav id="nav"></nav>
      <div class="sidebar-footer">
        <a href="../" target="_blank" rel="noopener" class="link-btn"><i class="fas fa-external-link-alt"></i> View site</a>
        <button id="logout" class="secondary"><i class="fas fa-sign-out-alt"></i> Log out</button>
      </div>
    </aside>
    <main class="content">
      <header class="page-header">
        <h1 id="page-title"></h1>
        <p id="page-hint" class="hint"></p>
      </header>
      <div id="page"></div>
    </main>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
